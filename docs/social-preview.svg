<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213A"/>
      <stop offset="1" stop-color="#0A1222"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.6" fill="#1A2943"/>
    </pattern>
    <symbol id="logo" viewBox="0 0 128 128">
      <rect width="128" height="128" rx="28" fill="url(#tile)"/>
      <path d="M20 37 L47 28 V92 L20 101 Z" fill="#1E3352"/>
      <path d="M47 28 L81 37 V101 L47 92 Z" fill="#2A4670"/>
      <path d="M81 37 L108 28 V92 L81 101 Z" fill="#1E3352"/>
      <g stroke="#3DDC84" stroke-width="6" stroke-linecap="round" fill="none">
        <path d="M33 77 L62 52"/>
        <path d="M62 52 L93 68"/>
      </g>
      <circle cx="33" cy="77" r="8.5" fill="#3DDC84" stroke="#0E1A2E" stroke-width="3"/>
      <circle cx="62" cy="52" r="8.5" fill="#3DDC84" stroke="#0E1A2E" stroke-width="3"/>
      <circle cx="93" cy="68" r="11" fill="#0E1A2E" stroke="#3DDC84" stroke-width="5"/>
      <circle cx="93" cy="68" r="3.5" fill="#3DDC84"/>
    </symbol>
  </defs>

  <rect width="1280" height="640" fill="#0A1222"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- name and promise -->
  <use href="#logo" x="80" y="140" width="112" height="112"/>
  <text x="216" y="230" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="100" font-weight="700" fill="#F2F6FC" letter-spacing="-2">droidmap</text>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="32" fill="#A9B7CC">
    <text x="80" y="330">An Android-aware map of your project,</text>
    <text x="80" y="374">for you, your pull requests</text>
    <text x="80" y="418">and your AI coding agent.</text>
  </g>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#DCE6F5">
    <rect x="80" y="468" width="74" height="44" rx="22" fill="#111C31" stroke="#2A4670" stroke-width="2"/>
    <text x="117" y="497" text-anchor="middle">CLI</text>
    <rect x="166" y="468" width="168" height="44" rx="22" fill="#111C31" stroke="#2A4670" stroke-width="2"/>
    <text x="250" y="497" text-anchor="middle">GitHub Action</text>
    <rect x="346" y="468" width="160" height="44" rx="22" fill="#111C31" stroke="#2A4670" stroke-width="2"/>
    <text x="426" y="497" text-anchor="middle">Gradle plugin</text>
    <rect x="518" y="468" width="146" height="44" rx="22" fill="#111C31" stroke="#2A4670" stroke-width="2"/>
    <text x="591" y="497" text-anchor="middle">MCP server</text>
  </g>
  <text x="80" y="590" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#6F82A0">github.com/hussainshirazi/droidmap</text>

  <!-- what it sees: one path through an app's wiring -->
  <g stroke="#3DDC84" stroke-width="3" stroke-opacity="0.75" fill="none" stroke-linecap="round">
    <path d="M935 128 L1055 170"/>
    <path d="M1055 226 L935 268"/>
    <path d="M935 324 L1055 366"/>
    <path d="M1055 422 L935 464"/>
  </g>
  <g font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="22" fill="#E6EEF9">
    <rect x="800" y="72" width="270" height="56" rx="14" fill="#13203A" stroke="#2A4670" stroke-width="2"/>
    <circle cx="826" cy="100" r="7" fill="#7AA7FF"/>
    <text x="844" y="108">profile/{id}</text>

    <rect x="920" y="170" width="270" height="56" rx="14" fill="#13203A" stroke="#2A4670" stroke-width="2"/>
    <circle cx="946" cy="198" r="7" fill="#C792EA"/>
    <text x="964" y="206">ProfileViewModel</text>

    <rect x="800" y="268" width="270" height="56" rx="14" fill="#13203A" stroke="#2A4670" stroke-width="2"/>
    <circle cx="826" cy="296" r="7" fill="#FFB86B"/>
    <text x="844" y="304">UserRepository</text>

    <rect x="920" y="366" width="270" height="56" rx="14" fill="#13203A" stroke="#2A4670" stroke-width="2"/>
    <circle cx="946" cy="394" r="7" fill="#3DDC84"/>
    <text x="964" y="402">UserDao</text>

    <rect x="800" y="464" width="270" height="56" rx="14" fill="#13203A" stroke="#FF6B6B" stroke-width="2.5"/>
    <circle cx="826" cy="492" r="7" fill="#3DDC84"/>
    <text x="844" y="500">AppDatabase v5</text>
  </g>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20">
    <path d="M1070 492 H1094" stroke="#FF6B6B" stroke-width="2.5"/>
    <rect x="1094" y="470" width="132" height="44" rx="12" fill="#3A1620" stroke="#FF6B6B" stroke-width="2"/>
    <text x="1160" y="490" text-anchor="middle" fill="#FFC2C2" font-size="16">no migration</text>
    <text x="1160" y="508" text-anchor="middle" fill="#FFC2C2" font-size="16">from 4 to 5</text>
  </g>
</svg>

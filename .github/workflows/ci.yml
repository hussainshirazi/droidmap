name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ["17", "21"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew test fatJar
        shell: bash
      - run: java -jar build/libs/droidmap.jar --version
      - run: java -jar build/libs/droidmap.jar check src/test/resources/sample --fail-on never
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        with:
          name: droidmap.jar
          path: build/libs/droidmap.jar

  # The GitHub Action in action.yml, run on the sample with the jar built here.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew fatJar
        shell: bash
      - uses: ./
        id: droidmap
        with:
          path: src/test/resources/sample
          jar: build/libs/droidmap.jar
          fail-on: never
          upload-sarif: "false"
          comment: "false"
      - name: SARIF paths point into the repository
        shell: bash
        run: |
          grep -q '"uri": "src/test/resources/sample/' "${{ steps.droidmap.outputs.sarif }}"
      - name: diff works in a shallow checkout
        shell: bash
        run: java -jar build/libs/droidmap.jar diff src/test/resources/sample --base HEAD

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ["17", "21"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew test fatJar
        shell: bash
      - run: java -jar build/libs/droidmap.jar --version
      - run: java -jar build/libs/droidmap.jar check src/test/resources/sample --fail-on never
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        with:
          name: droidmap.jar
          path: build/libs/droidmap.jar

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ["17", "21"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew test fatJar
        shell: bash
      - run: java -jar build/libs/droidmap.jar --version
      - run: java -jar build/libs/droidmap.jar check src/test/resources/sample --fail-on never
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        with:
          name: droidmap.jar
          path: build/libs/droidmap.jar

  # The Gradle plugin (gradle-plugin/), run by real Gradle builds (9, and 8 as most Android projects use) with the jar built here.
  gradle-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew fatJar && ./gradlew -p gradle-plugin test

  # The GitHub Action in action.yml, run on the sample with the jar built here.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew fatJar
        shell: bash
      - uses: ./
        id: droidmap
        with:
          path: src/test/resources/sample
          jar: build/libs/droidmap.jar
          fail-on: never
          upload-sarif: "false"
          comment: "false"
          merge-manifest: "true" # the sample has no Gradle wrapper: a warning, and the check still runs
      - name: SARIF paths point into the repository
        shell: bash
        run: |
          grep -q '"uri": "src/test/resources/sample/' "${{ steps.droidmap.outputs.sarif }}"
      - name: diff works in a shallow checkout
        shell: bash
        run: java -jar build/libs/droidmap.jar diff src/test/resources/sample --base HEAD
      # The Claude Code plugin's launcher downloads the release named in plugin.json and serves MCP.
      - name: The plugin starts droidmap with nothing installed but Java (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/plugin
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/plugin-data
        run: |
          plugin/launcher/droidmap --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | plugin/launcher/droidmap mcp src/test/resources/sample | grep -q '"serverInfo"'
      - name: The plugin starts droidmap with nothing installed but Java (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/plugin
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/plugin-data
        run: |
          plugin\launcher\droidmap.cmd --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | plugin\launcher\droidmap.cmd mcp src/test/resources/sample
          if (-not ($out -match '"serverInfo"')) { Write-Output $out; exit 1 }

  # The Docker image and the MCP Registry entry (server.json) that releases publish.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew fatJar
      - run: docker build -t droidmap .
      - name: The image checks a mounted project
        run: |
          docker run --rm droidmap --version
          docker run --rm -v "$PWD/src/test/resources/sample":/project droidmap check --fail-on never | tail -3
      - name: The image's MCP server answers
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | docker run --rm -i -v "$PWD/src/test/resources/sample":/project droidmap mcp | grep -q '"serverInfo"'
      - name: server.json matches the MCP Registry schema
        run: pipx run check-jsonschema --schemafile "$(jq -r '."$schema"' server.json)" server.json

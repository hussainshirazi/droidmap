name: Release

# Push a tag such as v0.2.0 to build droidmap.jar, attach it (and its checksum) to a GitHub release,
# move the v0 tag that Action users pin to, publish the Docker image and the MCP Registry entry, and open a
# pull request that points the Homebrew formula, Scoop manifest, Claude Code plugin and server.json at it.
# (v*.*.* only: moving v0 does not start another release.)
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  pull-requests: write
  packages: write   # the Docker image on ghcr.io
  id-token: write   # signing in to the MCP Registry as this repository

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew test fatJar
      - name: The tag matches the version in the code
        run: test "$(java -jar build/libs/droidmap.jar --version)" = "droidmap ${GITHUB_REF_NAME#v}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the version's section of CHANGELOG.md (from "## 0.2.1 (date)" to the next "## ").
          awk -v v="${GITHUB_REF_NAME#v}" '/^## / { on = ($2 == v) ; next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; fi
          printf '\n**Full changelog**: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> "$RUNNER_TEMP/notes.md"
          cd build/libs && sha256sum droidmap.jar > droidmap.jar.sha256
          gh release create "$GITHUB_REF_NAME" droidmap.jar droidmap.jar.sha256 --title "droidmap $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Move v0 to this release
        if: startsWith(github.ref_name, 'v0.')
        run: |
          git tag -f v0 "$GITHUB_SHA"
          git push -f origin v0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the Docker image
        run: |
          image=ghcr.io/hussainshirazi/droidmap
          docker build -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" .
          docker push "$image:${GITHUB_REF_NAME#v}"
          docker push "$image:latest"
      # The registry checks the image's label, so the image has to be public: if this step fails on the
      # first release, make the droidmap package public in its settings and run the workflow again.
      - name: Publish to the MCP Registry
        continue-on-error: true
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/mcp" && cd "$RUNNER_TEMP/mcp"
          jq --arg v "$version" '.version = $v | .packages[0].identifier = "ghcr.io/hussainshirazi/droidmap:\($v)"' \
            "$GITHUB_WORKSPACE/server.json" > server.json
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish || { echo "::warning::The MCP Registry did not take droidmap $version (is the ghcr.io package public?)"; exit 1; }
      # The Gradle Plugin Portal needs an API key of the account that owns io.github.hussainshirazi (repository
      # secrets GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET); without them the plugin is not published.
      - name: Publish the Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if [ -z "$GRADLE_PUBLISH_KEY" ]; then
            echo "::notice::No GRADLE_PUBLISH_KEY secret, so the Gradle plugin is not published"; exit 0
          fi
          ./gradlew -p gradle-plugin test publishPlugins -Pversion="${GITHUB_REF_NAME#v}"
      # main takes changes through pull requests only, so the update goes to a branch and a pull request.
      # (Creating it needs Settings > Actions > "Allow GitHub Actions to create and approve pull requests";
      # without that, the job summary has the link to open it by hand.)
      - name: Point Homebrew, Scoop, the plugin and server.json at this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(cut -d ' ' -f 1 build/libs/droidmap.jar.sha256)
          branch="packages-$version"
          git fetch --no-tags --depth=1 origin main
          git checkout -B "$branch" origin/main
          sed -i -E "s|download/v[0-9][^/]*/|download/v$version/|; s|^  version \".*\"|  version \"$version\"|; s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/droidmap.rb
          jq --arg v "$version" --arg h "$sha" \
            '.version = $v | .hash = $h | .url = "https://github.com/hussainshirazi/droidmap/releases/download/v\($v)/droidmap.jar"' \
            bucket/droidmap.json > bucket/droidmap.json.new && mv bucket/droidmap.json.new bucket/droidmap.json
          jq --arg v "$version" '.version = $v | .packages[0].identifier = "ghcr.io/hussainshirazi/droidmap:\($v)"' \
            server.json > server.json.new && mv server.json.new server.json
          jq --arg v "$version" '.version = $v' plugin/.claude-plugin/plugin.json > plugin.json.new && mv plugin.json.new plugin/.claude-plugin/plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Point Homebrew, Scoop, the plugin and server.json at droidmap $version"
          git push -f origin "$branch"
          title="Point Homebrew, Scoop, the plugin and server.json at droidmap $version"
          if ! gh pr create --base main --head "$branch" --title "$title" --body "Made by the release workflow for $GITHUB_REF_NAME."; then
            link="https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            echo "Open the pull request that updates the packages: $link" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Open $link to update Homebrew, Scoop, the plugin and server.json"
          fi

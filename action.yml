name: droidmap check
description: Android-aware checks (Room migrations and schemas, navigation, Hilt and Koin, Gradle modules, permissions) and what each pull request touches.
author: hussainshirazi
branding:
  icon: map
  color: green

inputs:
  path:
    description: The Android project's root folder, relative to the repository root.
    default: "."
  fail-on:
    description: "Fail the step on findings this severe or worse: error, warning, info or never."
    default: error
  upload-sarif:
    description: Upload the findings to GitHub code scanning, so they show on pull requests (the job needs `security-events write`).
    default: "true"
  comment:
    description: On a pull request, post (and keep updated) a comment saying what the change touches (the job needs `pull-requests write`).
    default: "true"
  args:
    description: Extra arguments for droidmap check, such as `--config tools/droidmap.toml`.
    default: ""
  merge-manifest:
    description: >-
      Run this Gradle task first so the merged manifest exists, and droidmap also checks the permissions libraries add:
      `true` means processReleaseMainManifest; with product flavors name the variant's, such as processProdReleaseMainManifest.
      It runs your build with the project's Gradle wrapper, so set up the JDK your build needs before this step
      (and never use it in a pull_request_target workflow, which would run a fork's build with your secrets). Off by default.
    default: ""
  base:
    description: Git ref to compare Room schema files with (room-schema-changed). `auto` uses a pull request's base branch, `none` turns it off; another ref must already be fetched.
    default: auto
  version:
    description: The droidmap release to use, such as 0.2.0. By default, the release this action was pinned to (or the latest one).
    default: ""
  jar:
    description: Path to a droidmap.jar to use instead of downloading one.
    default: ""

outputs:
  sarif:
    description: Path of the SARIF file with the findings.
    value: ${{ steps.check.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Get droidmap
      id: setup
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_JAR: ${{ inputs.jar }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        # Java 17+: the runner's preinstalled JDKs first, so the job's own JAVA_HOME is left alone.
        java=""
        for v in JAVA_HOME_21_X64 JAVA_HOME_21_ARM64 JAVA_HOME_21_arm64 JAVA_HOME_17_X64 JAVA_HOME_17_ARM64 JAVA_HOME_17_arm64; do
          d="${!v:-}"
          if [ -n "$d" ] && { [ -x "$d/bin/java" ] || [ -x "$d/bin/java.exe" ]; }; then java="$d/bin/java"; break; fi
        done
        if [ -z "$java" ]; then java="${JAVA_HOME:+$JAVA_HOME/bin/}java"; fi
        echo "java=$java" >> "$GITHUB_OUTPUT"
        if [ -n "$INPUT_JAR" ]; then echo "jar=$INPUT_JAR" >> "$GITHUB_OUTPUT"; exit 0; fi
        release="$INPUT_VERSION"
        if [ -z "$release" ] && [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then release="${ACTION_REF#v}"; fi
        if [ -n "$release" ]; then
          url="https://github.com/hussainshirazi/droidmap/releases/download/v$release/droidmap.jar"
        else
          url="https://github.com/hussainshirazi/droidmap/releases/latest/download/droidmap.jar"
        fi
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/droidmap.jar" "$url"
        echo "jar=$RUNNER_TEMP/droidmap.jar" >> "$GITHUB_OUTPUT"

    - name: Find the base to compare schema files with
      id: base
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
      run: |
        base=""
        case "$INPUT_BASE" in
          none|"") ;;
          auto)
            if [ -n "${GITHUB_BASE_REF:-}" ]; then
              # actions/checkout fetches only the pull request's merge commit: fetch the base branch's tip too.
              if git fetch --no-tags --depth=1 origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" > /dev/null 2>&1; then
                base="origin/$GITHUB_BASE_REF"
              else
                echo "::warning::droidmap could not fetch $GITHUB_BASE_REF, so room-schema-changed is skipped"
              fi
            fi ;;
          *) base="$INPUT_BASE" ;;
        esac
        echo "base=$base" >> "$GITHUB_OUTPUT"

    - name: Merge the manifest
      if: inputs.merge-manifest != '' && inputs.merge-manifest != 'false'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        TASK: ${{ inputs.merge-manifest }}
      run: |
        if [ "$TASK" = "true" ]; then TASK=processReleaseMainManifest; fi
        if [ ! -f gradlew ]; then
          echo "::warning::droidmap found no gradlew in $PWD, so it checks the source manifests only"; exit 0
        fi
        chmod +x gradlew
        if ! ./gradlew --no-daemon --quiet "$TASK"; then
          echo "::warning::droidmap could not run $TASK, so it checks the source manifests only"
        fi

    - name: Run droidmap check
      id: check
      shell: bash
      env:
        JAVA: ${{ steps.setup.outputs.java }}
        JAR: ${{ steps.setup.outputs.jar }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ARGS: ${{ inputs.args }}
        BASE: ${{ steps.base.outputs.base }}
      run: |
        set +e
        sarif="$RUNNER_TEMP/droidmap.sarif"
        extra=()
        if [ -n "$BASE" ]; then extra=(--base "$BASE"); fi
        # shellcheck disable=SC2086 # args is split into words on purpose
        "$JAVA" -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -jar "$JAR" check "$INPUT_PATH" --fail-on "$INPUT_FAIL_ON" --sarif "$sarif" "${extra[@]}" $INPUT_ARGS > "$RUNNER_TEMP/droidmap.txt"
        code=$?
        cat "$RUNNER_TEMP/droidmap.txt"
        { echo "### droidmap"; echo; echo '```'; cat "$RUNNER_TEMP/droidmap.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$sarif" ]; then echo "sarif=$sarif" >> "$GITHUB_OUTPUT"; fi

    - name: Say what the pull request touches
      if: steps.base.outputs.base != '' && github.event.pull_request.number
      shell: bash
      env:
        JAVA: ${{ steps.setup.outputs.java }}
        JAR: ${{ steps.setup.outputs.jar }}
        INPUT_PATH: ${{ inputs.path }}
        BASE: ${{ steps.base.outputs.base }}
        COMMENT: ${{ inputs.comment == 'true' && !github.event.pull_request.head.repo.fork }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        report="$RUNNER_TEMP/droidmap-diff.md"
        if ! "$JAVA" -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -jar "$JAR" diff "$INPUT_PATH" --base "$BASE" --format markdown > "$report"; then
          echo "::warning::droidmap diff failed, so there is no impact summary"; exit 0
        fi
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        if [ "$COMMENT" != "true" ]; then exit 0; fi
        # One comment per pull request, updated on every push.
        id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- droidmap -->")) | .id' 2>/dev/null | head -1)
        if [ -z "$id" ] && grep -q "No Android structure changed" "$report" && ! grep -q "Findings in the changed files" "$report"; then exit 0; fi
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$report" > /dev/null || echo "::warning::droidmap could not update its comment (does the job have pull-requests: write?)"
        else
          gh api "repos/$REPO/issues/$PR/comments" -F "body=@$report" > /dev/null || echo "::warning::droidmap could not comment (does the job have pull-requests: write?)"
        fi

    - name: Upload to code scanning
      # Pull requests from forks get a read-only token, which cannot upload: the job summary still has the findings.
      if: inputs.upload-sarif == 'true' && steps.check.outputs.sarif != '' && !github.event.pull_request.head.repo.fork
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.check.outputs.sarif }}
        category: droidmap

    - name: Result
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.code }}
      run: |
        case "$CODE" in
          0) ;;
          1) echo "::error::droidmap found problems at or above the fail-on severity"; exit 1 ;;
          *) echo "::error::droidmap could not run (exit code $CODE)"; exit "$CODE" ;;
        esac
